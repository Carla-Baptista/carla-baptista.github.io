<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel | Carla Baptista Advocacia</title>
  <link rel="stylesheet" href="painel.css?v=0.7.0">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <section id="tela-login" class="tela-login" aria-label="Entrar no painel"></section>

  <div id="app" class="app" hidden>
    <header class="barra">
      <span class="marca">Carla Baptista <small>Advocacia</small></span>
      <button type="button" id="botao-buscar" class="botao-buscar" aria-keyshortcuts="Control+K">Buscar <kbd>Ctrl+K</kbd></button>
      <span id="sinc" class="sinc" role="status" aria-live="polite"></span>
    </header>
    <nav class="menu" aria-label="Menu principal">
      <a href="#/inicio" data-rota="inicio">Início</a>
      <a href="#/agenda" data-rota="agenda">Agenda</a>
      <a href="#/clientes" data-rota="clientes">Clientes</a>
      <a href="#/processos" data-rota="processos">Processos</a>
      <a href="#/financeiro" data-rota="financeiro">Financeiro</a>
      <a href="#/parceiros" data-rota="parceiros">Parceiros</a>
      <a href="#/configuracoes" data-rota="configuracoes">Configurações</a>
    </nav>
    <main id="conteudo" class="conteudo" tabindex="-1"></main>
    <footer class="rodape-painel">Painel <span id="versao-painel"></span></footer>
  </div>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <dialog id="busca-geral" class="janela janela-busca" aria-label="Buscar em todo o painel"></dialog>

  <dialog id="janela" class="janela" aria-labelledby="janela-titulo"></dialog>

  <script src="../config.js?v=0.7.0"></script>
  <script src="app.js?v=0.7.0"></script>
</body>
</html>
